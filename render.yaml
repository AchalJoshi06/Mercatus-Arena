services:
  - type: web
    name: mercatus-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build -w server
    startCommand: npm start -w server
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Neon pooled connection string (Vercel → Storage → mercatus-db-sg)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@mercatus.tech
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: https://mercatus.dev-ace.dev
      - key: REGISTRATION_CODE
        sync: false
      - key: RATE_LIMIT_STORE
        value: postgres
      - key: RATE_LIMIT_API
        value: "1200"
      - key: TICK_INTERVAL_MS
        value: "1000"
      - key: PG_POOL_SIZE
        value: "10"
      - key: TRUST_PROXY
        value: "1"
