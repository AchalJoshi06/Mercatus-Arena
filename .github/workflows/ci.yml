name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mercatus
          POSTGRES_PASSWORD: mercatus
          POSTGRES_DB: mercatus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mercatus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        env:
          TEST_DATABASE_URL: postgres://mercatus:mercatus@localhost:5432/mercatus_test
        run: npm test

      - name: Type-check & build (server + web)
        run: npm run build