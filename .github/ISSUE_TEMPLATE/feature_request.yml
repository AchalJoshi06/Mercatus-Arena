name: Feature request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement! Describe the problem you're solving
        and the behavior you'd like to see.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What can't you currently do, or what is awkward today?
      placeholder: "I want to see a second-by-second PnL curve for my team..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the feature and how it should behave.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or different approaches you tried.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: Server / engine
        - label: Portal UI
        - label: Trading API / WebSocket
        - label: Tooling / docs